apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: chat-service
        image: atcs1234/zpc:dev
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_ADDR
          valueFrom:
            secretKeyRef:
              name: chat-service-secrets
              key: redis-addr
              optional: true
        - name: MINIO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: chat-service-secrets
              key: minio-endpoint
              optional: true
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: chat-service-secrets
              key: minio-access-key
              optional: true
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: chat-service-secrets
              key: minio-secret-key
              optional: true
        - name: MINIO_BUCKET
          value: "chat-media"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 30
